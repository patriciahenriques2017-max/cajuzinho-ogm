<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professor Léo do Samuel</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a4d">
<link rel="icon" href="icons/icone-192.png">
<link rel="apple-touch-icon" href="icons/icone-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: app de uma coluna para celular. Início = trilha das 6 partes; Treino = cartão do trecho + 5 níveis + ações; Ensaio = roteiro com cronômetro */
  --ceu:#e6f3fa; --papel:#ffffff; --tinta:#17324a; --buriti:#1f7a4d; --buriti-claro:#dff2e7;
  --ipe:#f6b90c; --ipe-claro:#fff4cf; --terra:#c2452d; --suave:#526b7e; --linha:#c9dce8;
  --display:"Baloo 2","Trebuchet MS",Arial,sans-serif; --corpo:Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ceu);color:var(--tinta);font-family:var(--corpo);font-size:18px;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px;font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:20px;font-weight:600;color:var(--buriti)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:3px solid var(--terra);outline-offset:2px}

.prof{display:flex;flex-direction:column;gap:10px}
.prof svg{display:block;width:100%;max-width:400px;height:auto;align-self:center;border-radius:16px;border:2px solid var(--tinta)}
.palco{width:100%;max-width:400px;aspect-ratio:320/220;align-self:center;border-radius:16px;border:2px solid var(--tinta);overflow:hidden;background:#2f6b52}
.palco canvas,.palco svg{display:block;width:100%;height:100%;max-width:none;border:0;border-radius:0}
.palp{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:pisca 4.6s infinite}
@keyframes pisca{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.boca-a{display:none;transform-box:fill-box;transform-origin:center}
body.falando .boca-a{display:block;animation:fala .17s infinite alternate ease-in-out}
body.falando .boca-f{display:none}
@keyframes fala{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.cabeca{transform-origin:160px 142px;animation:respira 3.4s infinite ease-in-out}
@keyframes respira{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-1.5deg)}}
.ante{transition:transform .4s}
.ad{transform-origin:223px 216px;transform:rotate(172deg)}
.ae{transform-origin:97px 216px;transform:rotate(-172deg)}
.oi .ae{animation:oi 3.2s 1 ease-in-out}
@keyframes oi{0%,100%{transform:rotate(-172deg)}15%,85%{transform:rotate(-22deg)}30%,58%{transform:rotate(-48deg)}44%,72%{transform:rotate(-14deg)}}
.viva .ad{animation:vivaD .45s infinite alternate ease-in-out}
.viva .ae{animation:vivaE .45s -.22s infinite alternate ease-in-out}
@keyframes vivaD{from{transform:rotate(6deg)}to{transform:rotate(34deg)}}
@keyframes vivaE{from{transform:rotate(-6deg)}to{transform:rotate(-34deg)}}
body.falando .cabeca{animation:aceno 1.3s infinite ease-in-out}
@keyframes aceno{0%,100%{transform:rotate(-3.5deg)}30%{transform:rotate(3deg) translateY(-3px)}55%{transform:rotate(-1deg) translateY(1.5px)}80%{transform:rotate(4deg) translateY(-1.5px)}}
body.falando .sobr{animation:sobr 1.7s infinite ease-in-out}
@keyframes sobr{0%,60%,100%{transform:translateY(0)}75%,88%{transform:translateY(-4px)}}
body.falando .ad{animation:gestoD 2s infinite ease-in-out}
body.falando .ae{animation:gestoE 3s infinite ease-in-out}
@keyframes gestoD{0%,100%{transform:rotate(22deg)}25%{transform:rotate(46deg)}50%{transform:rotate(14deg)}75%{transform:rotate(38deg)}}
@keyframes gestoE{0%,28%,100%{transform:rotate(-172deg)}44%{transform:rotate(-30deg)}60%{transform:rotate(-52deg)}80%{transform:rotate(-24deg)}}
@media (prefers-reduced-motion:reduce){.palp,.cabeca,.ante,.sobr,body.falando .boca-a,body.falando .cabeca,body.falando .ante,body.falando .sobr{animation:none}}
.voz{align-self:flex-start;padding:7px 12px;border:2px solid var(--tinta);border-radius:99px;background:var(--papel);font-size:15px;font-weight:bold}
.voz.off{background:var(--linha)}
.vel .btn{flex:1 1 90px;font-size:16px;padding:9px 6px}
.balao{text-align:left;font-size:18px;line-height:1.45;background:var(--papel);border:2px solid var(--tinta);border-radius:4px 18px 18px 18px;padding:12px 14px}
.balao b{font-family:var(--display);font-size:20px;display:block}
.balao small{display:block;margin-top:6px;font-size:14px;color:var(--suave)}

.barra{height:14px;background:var(--papel);border:2px solid var(--tinta);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ipe)}
.barra.ouro{height:18px;border-color:#7a5a00;box-shadow:0 0 0 2px #ffe27a,0 0 14px 3px rgba(246,185,12,.75);animation:pulsa 1.8s ease-in-out infinite}
.barra.ouro i{background:linear-gradient(100deg,#a8770a 0%,#f6c400 22%,#fff7c8 38%,#ffd84a 50%,#c99400 70%,#ffe680 88%,#a8770a 100%);background-size:250% 100%;animation:brilho 2.2s linear infinite}
@keyframes brilho{from{background-position:250% 0}to{background-position:0 0}}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 2px #ffe27a,0 0 10px 2px rgba(246,185,12,.55)}50%{box-shadow:0 0 0 2px #fff1b0,0 0 20px 6px rgba(255,215,0,.9)}}
.conta.ouro{color:#8a6400;font-weight:bold}
.barra.ouro{cursor:pointer}
@media (prefers-reduced-motion:reduce){.barra.ouro,.barra.ouro i{animation:none}}

.conta{font-size:16px;color:var(--suave)}

.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;font-family:var(--display);font-size:21px;font-weight:800;text-align:center;border:2px solid var(--tinta);box-shadow:0 4px 0 var(--tinta)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.btn.verde{background:var(--buriti);color:#fff}
.btn.amarelo{background:var(--ipe)}
.btn.branco{background:var(--papel)}
.linha{display:flex;gap:10px;flex-wrap:wrap}
.linha .btn{flex:1 1 140px;font-size:18px;padding:11px 10px}

.parte{display:flex;flex-direction:column;gap:8px}
.parte h3 span{color:var(--terra)}
.trecho{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--papel);border:2px solid var(--linha);border-radius:12px;padding:11px 12px}
.trecho .nome{flex:1}
.trecho.feito{border-color:var(--buriti);background:var(--buriti-claro)}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--linha)}
.pips i.on{background:var(--buriti)}
.estrela{width:22px;font-size:20px;color:var(--ipe);text-shadow:0 0 1px var(--tinta)}

.topo{display:flex;align-items:center;gap:10px}
.topo .volta{padding:8px 12px;border:2px solid var(--tinta);border-radius:10px;background:var(--papel);font-weight:bold}
.topo .onde{flex:1;font-size:15px;color:var(--suave);text-align:right}
.niveis{display:flex;gap:6px}
.niveis button{flex:1;padding:7px 2px;border-radius:10px;border:2px solid var(--linha);background:var(--papel);font-size:13px;line-height:1.2}
.niveis button b{display:block;font-family:var(--display);font-size:19px}
.niveis button.passou{background:var(--buriti-claro);border-color:var(--buriti)}
.niveis button.atual{background:var(--ipe);border-color:var(--tinta)}
.cartao{background:var(--papel);border:2px solid var(--tinta);border-radius:16px;padding:16px;font-size:21px;line-height:1.75}
.lac{display:inline-block;border-bottom:3px solid var(--terra);background:var(--ipe-claro);border-radius:6px 6px 0 0;padding:0 4px;line-height:1.35;text-align:left;color:var(--terra);font-weight:bold}
.lac.ok{background:var(--buriti-claro);border-color:var(--buriti);color:var(--buriti);min-width:0 !important}
.dica{background:var(--ipe-claro);border-left:6px solid var(--ipe);border-radius:8px;padding:10px 12px;font-size:17px}
.festa{text-align:center;font-family:var(--display);font-size:24px;font-weight:800;color:var(--buriti)}

.relogio{font-family:var(--display);font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
details{background:var(--papel);border:2px solid var(--linha);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:bold}
details p{margin-top:8px;font-size:19px;line-height:1.6}
@media (max-width:380px){.cartao{font-size:19px}.niveis button{font-size:11px}}
</style>
</head>
<body>

<script src="lib/three.min.js"></script>

<script src="modelo.js" async></script>
<script>
const P=[
{t:'Abertura',c:[
 {t:'Saudação',x:'Bom dia à banca examinadora e boa tarde a todos. Meu nome é Samuel, sou aluno do 5º ano matutino, turma da professora Giullyana.'},
 {t:'Tema',x:'Hoje vou apresentar a minha primeira CFS, na disciplina de Geografia, com o tema: “Região Centro-Oeste”.'},
 {t:'Palavras para definir',x:'As palavras que escolhi para definir são: Região e Fronteira. Região: é uma porção de espaço geográfico que apresenta características comuns. Fronteira: são limites que separam o território de um país, estados ou outra unidade política.',d:'Região junta o que é parecido. Fronteira separa.'},
 {t:'Referência bíblica',x:'A Referência Bíblica que escolhi foi Salmos 33:12, que diz: “Bem-aventurada é a nação cujo Deus é o Senhor, e o povo que ele escolheu para a sua herança”.'}
]},
{t:'O Brasil e o Centro-Oeste',c:[
 {t:'O Brasil',x:'Para começar, farei um breve resumo das características territoriais do Brasil. O Brasil é o 5º maior país do mundo, com uma extensão de 8.515.767,049 km², situada na América do Sul.',d:'O número grande: 8 milhões, 515 mil, 767 quilômetros quadrados.'},
 {t:'Estados e regiões',x:'O território é dividido em 26 estados e o Distrito Federal, sede da capital, Brasília, agrupados nas regiões Norte, Nordeste, Centro-Oeste, Sudeste e Sul.',d:'26 estados, 1 Distrito Federal, 5 regiões.'},
 {t:'Tamanho da região',x:'A Região Centro-Oeste é a segunda maior em extensão territorial do Brasil, porém é a menos populosa. A extensão é 1.606.371 km² (cerca de 18,8% de todo o território brasileiro).',d:'Segunda maior no tamanho, última em população.'},
 {t:'Fronteiras e estados',x:'É a única região do país que faz fronteira com todas as outras regiões brasileiras (exceto a Região Sul). Formada por três estados: Goiás (GO), Mato Grosso (MT) e Mato Grosso do Sul (MS), além do Distrito Federal (DF).',d:'Três estados e o DF: Goiás, Mato Grosso, Mato Grosso do Sul.'},
 {t:'História',x:'A região era habitada por diversas etnias indígenas. A ocupação europeia começou com as expedições paulistas (Bandeiras) nos Séculos XVII e XVIII, que buscavam índios para escravizar e ouro.',d:'XVII é 17 e XVIII é 18.'},
 {t:'Amazônia',x:'Se destaca na região Centro-Oeste a Amazônia, a maior floresta tropical do mundo, abrigando milhares de espécies de plantas e animais.'}
]},
{t:'Aspectos físicos',c:[
 {t:'Clima tropical típico',x:'O clima predominante da região é o Tropical Típico, caracterizado por temperaturas elevadas ao longo de todo o ano, com um verão quente e chuvoso e um inverno seco e ameno.',d:'Verão quente e chuvoso. Inverno seco e ameno.'},
 {t:'Outros climas',x:'No norte do Mato Grosso predomina o clima equatorial, quente e chuvoso o ano todo. Já o sul do Mato Grosso do Sul e trechos do Distrito Federal apresentam o clima tropical de altitude, com temperaturas mais amenas.',d:'Norte: equatorial. Sul e DF: tropical de altitude.'},
 {t:'Vegetação',x:'A vegetação do Centro-Oeste é dominada pelo Cerrado e pelo Pantanal, com trechos de Floresta Amazônica ao norte.'},
 {t:'Hidrografia',x:'A hidrografia é marcada pela presença de importantes bacias hidrográficas, como a Amazônica, do Paraná e do Araguaia-Tocantins, destacando-se como um grande divisor de águas nacional. Além do Pantanal, a maior planície alagada do mundo.',d:'Três bacias: Amazônica, Paraná e Araguaia-Tocantins.'},
 {t:'Relevo',x:'O relevo da Região Centro-Oeste é predominantemente formado por extensos planaltos e chapadas no interior, onde se localizam as principais áreas agrícolas, delimitados por uma vasta área rebaixada que abriga a planície do Pantanal.',d:'No alto: planaltos e chapadas. Embaixo: a planície do Pantanal.'}
]},
{t:'Aspectos econômicos',c:[
 {t:'Economia',x:'A economia do Centro-Oeste impulsionou seu PIB e expandiu sua fronteira agrícola a partir dos anos 1950, com a criação de Brasília e incentivos à ocupação rural.'},
 {t:'Agricultura',x:'A agricultura evoluiu da subsistência familiar para um modelo comercial altamente produtivo, tecnológico e voltado para grandes mercados e exportação. Conhecida como “celeiro” do país, a região destaca-se no cultivo de grãos como soja e milho, além de algodão, cana-de-açúcar e diversos outros produtos agrícolas.',d:'Quatro plantações: soja, milho, algodão e cana-de-açúcar.'},
 {t:'Pecuária',x:'A pecuária é a principal atividade econômica do Centro-Oeste, impulsionada pelo maior rebanho bovino do país, cerca de 70 milhões de cabeças. A região também se destaca na criação de suínos, ovinos, equinos e bubalinos.',d:'Suínos são porcos, ovinos são ovelhas, equinos são cavalos, bubalinos são búfalos.'},
 {t:'Extrativismo',x:'No extrativismo vegetal, destaque para madeira, erva-mate e látex. No extrativismo mineral, ouro, diamantes e grandes reservas de manganês no Maciço de Urucum.',d:'Vegetal: madeira, erva-mate, látex. Mineral: ouro, diamantes, manganês.'},
 {t:'Indústria',x:'O setor industrial no Centro-Oeste vem acelerando seu desenvolvimento, impulsionado pela mecanização do campo, além de segmentos relevantes como a indústria química, automobilística, de bebidas e celulose.'},
 {t:'Transporte',x:'O transporte é predominantemente rodoviário. Para reduzir custos e otimizar o transporte de grãos e minérios, ganham força as ferrovias e as hidrovias estratégicas, como a do Paraná e Paraguai.',d:'Rodovia é estrada, ferrovia é trem, hidrovia é rio.'},
 {t:'Turismo',x:'O turismo na região reúne destinos como as paisagens do Cerrado nas Chapadas dos Veadeiros e dos Guimarães, a rica fauna do Pantanal e as águas termais de Caldas Novas.',d:'Três destinos: Chapadas, Pantanal e Caldas Novas.'}
]},
{t:'Cultura da região',c:[
 {t:'Cultura',x:'A cultura da região Centro-Oeste é uma rica tapeçaria moldada pela fusão das tradições indígenas, a herança dos bandeirantes, as manifestações folclóricas do Cerrado e o dinamismo da capital federal.'},
 {t:'Artesanato',x:'O artesanato da região Centro-Oeste reflete a biodiversidade do Cerrado e do Pantanal, expressando-se no uso de matérias-primas naturais como madeira, fibras vegetais, argila e capim-dourado.',d:'Quatro materiais: madeira, fibras, argila e capim-dourado.'},
 {t:'Culinária',x:'Culinária: pratos à base de peixes fluviais, carnes e mandioca. O grande destaque da região é o arroz com pequi, prato emblemático que traz o fruto típico do Cerrado como o símbolo mais marcante da identidade gastronômica local.'},
 {t:'Dança',x:'As danças combinam influências indígenas, africanas, europeias e dos países vizinhos, sendo apresentadas em festas tradicionais ao som marcante da viola e em ritmos como o siriri, cururu, chupim, xote e catira.',d:'Cinco ritmos: siriri, cururu, chupim, xote e catira.'},
 {t:'Festas típicas',x:'As festas típicas expressam a identidade cultural e a religiosidade da região, com celebrações tradicionais como a Congada, a Procissão do Fogaréu, o Festival de Cururu e Siriri, a Festa do Boi-à-Serra e a Festa de Nossa Senhora do Perpétuo Socorro.',d:'São cinco festas. Conte nos dedos enquanto fala.'},
 {t:'Variações linguísticas',x:'As variações linguísticas refletem a herança dos bandeirantes paulistas combinada a fortes influências migratórias dos mineiros, gaúchos e a fronteira paraguaia. Por exemplo, Arreda: tirar, remover; e Capaz: expressão de surpresa ou dúvida.'}
]},
{t:'Encerramento',c:[
 {t:'Princípios',x:'Os princípios que relacionei com o assunto foram: Individualidade: aprendi que Deus criou cada região com características diferentes das outras. Soberania: aprendi que devemos usar nosso conhecimento geográfico com sabedoria e que podemos adorar a Deus em qualquer lugar e a qualquer momento.',d:'Dois princípios: Individualidade e Soberania.'},
 {t:'Posso relacionar',x:'Posso relacionar o assunto pesquisado sobre a Região Centro-Oeste na disciplina de Geografia, em primeiro lugar, com o meu pai, que é professor de Geografia e sempre compartilha seu conhecimento geográfico comigo. Também relaciono o clima da região pesquisada com o da Região Nordeste, pois ambas apresentam temperaturas médias elevadas na maior parte do ano. Além disso, relaciono com a minha fé, pois podemos adorar a Deus em qualquer lugar e a qualquer momento.',d:'Três relações: meu pai, o clima do Nordeste e a minha fé.'},
 {t:'Agradecimento',x:'Primeiro sou grato a Deus, que me capacitou para realizar essa pesquisa, à minha família, que esteve presente me apoiando, aos colegas de classe, professores e à banca.',d:'A ordem: Deus, família, colegas, professores, banca.'},
 {t:'Conclusão',x:'Concluo este trabalho refletindo como foi importante conhecer os aspectos da Região Centro-Oeste, sua riqueza cultural, sua força econômica e a singularidade de suas paisagens, compreendendo ainda mais a diversidade e a importância dessa região para o nosso país. Agradeço a atenção de todos!'}
]}
];
const F=[];P.forEach((p,i)=>p.c.forEach((c,j)=>{c.id=i+'-'+j;c.p=i;F.push(c)}));
const NIV=[['1','Ler'],['2','Faltam algumas'],['3','Faltam muitas'],['4','Só iniciais'],['5','De cor']];
const FALA=['',
 'Leia em voz alta duas vezes, bem devagar.',
 'Algumas palavras sumiram. Fale o trecho em voz alta e toque no espaço para conferir.',
 'Agora sumiram mais palavras. Fale tudo e só toque se travar.',
 'Ficou só a primeira letra de cada palavra. Fale o trecho inteiro.',
 'Hora de falar de cor, olhando para a plateia. Depois confira.'];
const KEY='tuiuiu-samuel';
let lv={};try{lv=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const salva=()=>{try{localStorage.setItem(KEY,JSON.stringify(lv))}catch(e){}};
const temVoz=typeof Audio!=='undefined';
let S={v:'home',i:0,n:1,ver:false,festa:false},seg=0,tick=null;
const app=document.getElementById('app');

  ns.forEach(m=>[-7,0,6].forEach(c=>{const o=C.createOscillator();o.type='sawtooth';o.frequency.value=hz(m);o.detune.value=c;
   const l=C.createOscillator(),lg=C.createGain();l.frequency.value=4.8+Math.random()*.8;lg.gain.value=hz(m)*.006;l.connect(lg);lg.connect(o.frequency);

   o.connect(g);g.connect(voz);o.start(s);l.start(s);o.stop(e+.1);l.stop(e+.1)}))});
 [84,88,91,96,91,96,100].forEach((m,i)=>{const s=t0+.3+i*.22,o=C.createOscillator(),g=C.createGain();o.type='sine';o.frequency.value=hz(m);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.05,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+1.6);o.connect(g);g.connect(bus);o.start(s);o.stop(s+1.7)});

function texto(c,n){
